name: Docker

# Builds the Docker image and pushes it to GHCR (ghcr.io/quer3q/ps5-dump-forge).
# - Push to main (Dockerfile or app/ changed): tags :latest and :main-<sha>
# - Tag v*: tags :v<version>, :latest
# - workflow_dispatch: manual build, image kept on the run (not pushed)
#
# Multi-arch: linux/amd64 and linux/arm64 via buildx + QEMU.
# The image's ENTRYPOINT is ps5-dump-forge; CMD starts the web UI on :8095.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
